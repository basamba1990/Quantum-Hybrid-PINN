<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #FFFFFF; color: #334155; }
        .slide-container { width: 1280px; min-height: 720px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(12, 1fr); pointer-events: none; z-index: 0; }
        .grid-col { border-right: 1px solid rgba(2, 132, 199, 0.05); height: 100%; }
        
        .content-box { z-index: 1; width: 80%; text-align: center; border-top: 2px solid #0284C7; border-bottom: 2px solid #0284C7; padding: 60px 0; }
        
        h1 { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 48px; color: #0F172A; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-size: 28px; color: #0284C7; margin-bottom: 40px; font-weight: 400; }
        
        .divider { width: 100px; height: 4px; background: #0284C7; margin: 30px auto; }
        
        .info-section { display: flex; justify-content: space-around; width: 100%; margin-top: 40px; }
        .info-item { text-align: center; }
        .info-label { font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #0284C7; font-size: 16px; margin-bottom: 8px; text-transform: uppercase; }
        .info-value { font-size: 20px; color: #334155; }
        
        .footer-date { position: absolute; bottom: 40px; font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #0F172A; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-overlay">
            <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
            <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
            <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
        </div>
        
        <div class="content-box">
            <p style="font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #0284C7; margin-bottom: 15px;">MÉMOIRE DE MASTER</p>
            <h1>Optimisation de la Sécurité et de l'Intégrité des Infrastructures d'Hydrogène Cryogénique</h1>
            <p class="subtitle">Par Jumeaux Numériques et Physics-Informed Neural Networks (PINNs)</p>
            
            <div class="info-section">
                <div class="info-item">
                    <p class="info-label">Présenté par</p>
                    <p class="info-value">Samba Ba</p>
                    <p style="font-size: 14px; color: #64748b;">basamba1990@yahoo.fr</p>
                </div>
                <div class="info-item">
                    <p class="info-label">Domaine</p>
                    <p class="info-value">Ingénierie Physique & IA</p>
                </div>
            </div>
        </div>
        
        <div class="footer-date">15 AOÛT 2026</div>
    </div>
</body>
</html>
