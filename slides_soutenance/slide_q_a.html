<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #FFFFFF; color: #334155; }
        .slide-container { width: 1280px; min-height: 720px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(12, 1fr); pointer-events: none; z-index: 0; }
        .grid-col { border-right: 1px solid rgba(2, 132, 199, 0.05); height: 100%; }
        
        .content-box { z-index: 1; width: 80%; text-align: center; border-top: 2px solid #0284C7; border-bottom: 2px solid #0284C7; padding: 80px 0; }
        
        h1 { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 64px; color: #0F172A; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 4px; }
        .subtitle { font-size: 32px; color: #0284C7; margin-bottom: 40px; font-weight: 400; }
        
        .contact-info { margin-top: 50px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .link-item { font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #334155; font-size: 18px; display: flex; align-items: center; }
        .link-item i { color: #0284C7; margin-right: 15px; font-size: 22px; }
        
        .footer-tag { position: absolute; bottom: 40px; font-family: 'Courier New', Courier, monospace; font-weight: 700; color: #0F172A; font-size: 14px; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-overlay">
            <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
            <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
            <div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div><div class="grid-col"></div>
        </div>
        
        <div class="content-box">
            <h1>Merci de votre attention</h1>
            <p class="subtitle">Place aux questions et à la discussion</p>
            
            <div class="contact-info">
                <div class="link-item">
                    <i class="fas fa-globe"></i>
                    <span>https://quantum-hybrid-pinn-web.vercel.app</span>
                </div>
                <div class="link-item">
                    <i class="fab fa-github"></i>
                    <span>github.com/basamba1990/Quantum-Hybrid-PINN</span>
                </div>
                <div class="link-item">
                    <i class="fas fa-envelope"></i>
                    <span>basamba1990@yahoo.fr</span>
                </div>
            </div>
        </div>
        
        <div class="footer-tag">SOUTENANCE DE MASTER - SAMBA BA - 2026</div>
    </div>
</body>
</html>
