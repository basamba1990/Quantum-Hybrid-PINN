schema_version: "case-parameters.v1"
registry_status: "INPUTS_REQUIRED"
policy:
  no_defaults: true
  no_synthetic_validation: true
  validated_requires_source_and_provenance: true
  null_values_block_solver_run: true
  null_values_block_g0_g5: true

sources:
  nist_srd_69:
    title: "NIST Chemistry WebBook, SRD 69 — Thermophysical Properties of Fluid Systems"
    uri: "https://webbook.nist.gov/chemistry/fluid/"
    authority: "NIST"
    use: "Hydrogen/parahydrogen thermophysical properties and unit-consistent reference tables"
  nasa_zbot:
    title: "NASA — Zero-Boil-Off Tank Experiments"
    uri: "https://science.nasa.gov/science-research/science-enabling-technology/zero-boil-off-tank-experiments-to-enable-long-duration-space-exploration/"
    authority: "NASA"
    use: "Cryogenic tank self-pressurization, boiling, jet mixing, temperature, pressure and PIV comparison"
  nrel_heavy_duty:
    title: "OSTI/NREL — Assessment of Heavy-Duty Fueling Methods and Components"
    uri: "https://www.osti.gov/biblio/3013239"
    authority: "NREL/DOE"
    use: "Heavy-duty hydrogen fueling methods, components and operating data"
  altera_thermal:
    title: "Altera — Thermal Design User Guide, Heat Sinks"
    uri: "https://docs.altera.com/r/docs/814008/24.3/thermal-design-user-guide-agilextm-5-fpgas-and-socs/heat-sinks"
    authority: "Altera"
    use: "Device-specific thermal limits and heatsink design inputs"
  usgs_hoek_brown:
    title: "USGS — Defining the Hoek–Brown constant mi for volcanic lithologies"
    uri: "https://pubs.usgs.gov/publication/70237589"
    authority: "USGS"
    use: "Rock-mass strength parameter provenance and Hoek–Brown context"

