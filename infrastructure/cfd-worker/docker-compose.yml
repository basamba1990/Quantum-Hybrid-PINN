services:
  lh2-cfd-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lh2-cfd-worker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CASE_ROOT: /cases
      ARTIFACT_ROOT: /artifacts
      CFD_TIMEOUT_SECONDS: "3600"
      OPENFOAM_SOLVER: reactingTwoPhaseEulerFoam
    volumes:
      - ../../pilot_case:/cases:ro
      - lh2-cfd-artifacts:/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
volumes:
  lh2-cfd-artifacts:
