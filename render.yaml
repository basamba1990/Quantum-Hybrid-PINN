services:
  - type: web
    name: quantum-pinn-api
    env: docker
    dockerContext: apps/api
    dockerfilePath: Dockerfile
    plan: free # Explicitly mention free plan
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_PATH
        value: models/pinn_model.pt
      - key: TORCH_NUM_THREADS
        value: "1" # Limit threads to save memory
      - key: MALLOC_ARENA_MAX
        value: "2" # Optimize memory allocation for glibc
      - key: NEXT_PUBLIC_API_URL
        value: https://quantum-pinn-api-qef2.onrender.com
      - key: H2_INFERENCE_API_URL
        value: https://quantum-pinn-api-qef2.onrender.com
      - key: API_BASE_URL
        value: https://quantum-pinn-api-qef2.onrender.com
      - key: SUPABASE_URL
        value: https://ivhxnaxhgfbiqlhgfkik.supabase.co
      - key: SUPABASE_BUCKET_NAME
        value: pinn-models
      - key: SUPABASE_MODEL_PATH
        value: pinn_model.pt
    disk:
      name: model-storage
      mountPath: /data
      sizeGB: 1
