schema: quantum-pilot-acceptance.v1
case_id: PILOT-001
status: DRAFT_REQUIRES_PARTNER_APPROVAL
scope: one_authorized_non_safety_critical_cfd_case
protocol_version: pilot-001-independent-held-out-v1
criteria_must_be_frozen_before_evaluation: true
criteria_freeze_artifact: protocol/acceptance_criteria_freeze.json
training_condition: aoa_5
evaluation_condition: aoa_17
evaluation_manifest_must_be_hidden_from_training: true
post_hoc_threshold_changes: INVALID

rules:
  missing_evidence: INCONCLUSIVE
  fabricated_or_default_metric: FAIL
  synthetic_demo_data_as_reference: FAIL
  validation_requires_all_gates: true
  tolerance_source: protocol_approved_before_run

metrics:
  # All tolerances remain pending domain-owner approval. They must be frozen
  # in protocol/acceptance_criteria_freeze.json before the held-out run.
  - id: pressure_l2_relative
    field: pressure
    definition: ||p_pinn - p_reference||_2 / ||p_reference||_2
    tolerance: PENDING_PARTNER_APPROVAL
  - id: velocity_l2_relative
    field: velocity
    definition: ||u_pinn - u_reference||_2 / ||u_reference||_2
    tolerance: PENDING_PARTNER_APPROVAL
  - id: pressure_max_absolute
    field: pressure
    definition: max(abs(p_pinn - p_reference))
    tolerance: PENDING_PARTNER_APPROVAL
  - id: mass_balance_relative
    field: mass_flux
    definition: abs(inlet_flux - outlet_flux) / max(abs(inlet_flux), abs(outlet_flux))
    tolerance: PENDING_PARTNER_APPROVAL
  - id: residual_mass_l2
    field: mass_residual
    definition: sqrt(mean(R_mass^2))
    tolerance: PENDING_PARTNER_APPROVAL
  - id: residual_momentum_l2
    field: momentum_residual
    definition: sqrt(mean(R_momentum^2))
    tolerance: PENDING_PARTNER_APPROVAL

blocking_gates:
  cfd_physical_acceptance:
    required: true
    rationale: numerical convergence alone does not establish physical validity
    current_blocker: negative_drag_requires_review
  data_independence:
    required: true
    rationale: AoA 17 evaluation data must not be available to training
  criteria_freeze:
    required: true
    rationale: thresholds must be approved before results are observed
  independent_reproduction:
    required: true
    rationale: final decision must be reproduced in a clean environment

gates:
  G0:
    requirement: authorization_and_protocol_approved
  G1:
    requirement: cfd_volume_contract_and_topology_coherent
    decision_if_structural_only: G1_EVIDENCE_GENERATED_NOT_CERTIFIED
  G2:
    requirement: mesh_boundary_conditions_and_units_documented
  G3:
    requirement: run_manifest_environment_seed_and_logs_persisted
  G4:
    requirement: residuals_and_conservation_computed_from_real_evidence
  G5:
    requirement: independent_comparison_meets_all_approved_tolerances
    held_out_required: true
    training_condition: aoa_5
    evaluation_condition: aoa_17

success:
  status: PASS
  conditions:
    - all_gates_pass
    - no_metric_is_missing
    - no_fabricated_or_default_metric
    - reproduction_has_same_gate_decision
    - cfd_physical_reference_accepted
    - held_out_evaluation_completed
    - criteria_were_frozen_before_evaluation

failure:
  statuses:
    - FAIL
    - INCONCLUSIVE
  reporting: failure_first_with_blocking_gate_and_missing_evidence
