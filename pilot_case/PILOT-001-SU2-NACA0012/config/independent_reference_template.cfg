% PILOT-001 control run using the official SU2 NACA0012 mesh.
% This is an independent SU2 CFD reference candidate, not a NLR comparison.
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
READ_BINARY_RESTART= NO
NZONES= 1
MACH_NUMBER= 0.8
AOA= 1.25
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )
NUM_METHOD_GRAD= GREEN_GAUSS
OBJECTIVE_FUNCTION= DRAG
CFL_NUMBER= 5.0
CFL_ADAPT= NO
RK_ALPHA_COEFF= ( 0.66667, 0.66667, 1.0 )
ITER= 300
MGLEVEL= 2
MGCYCLE= W_CYCLE
MG_PRE_SMOOTH= ( 4, 4, 4, 4 )
MG_POST_SMOOTH= ( 4, 4, 4, 4 )
MG_CORRECTION_SMOOTH= ( 1, 1, 1, 1 )
MG_DAMP_RESTRICTION= 0.5
MG_DAMP_PROLONGATION= 0.5
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.02 )
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
MESH_FILENAME= mesh_NACA0012_inv.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= solution_flow
RESTART_FILENAME= restart_flow
CONV_FILENAME= history
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_WRT_FREQ= 100
SCREEN_OUTPUT= ( INNER_ITER, RMS_RES, LIFT, DRAG )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRESSURE, MACH )
OUTPUT_FILES= ( RESTART_ASCII, PARAVIEW, SURFACE_CSV )
