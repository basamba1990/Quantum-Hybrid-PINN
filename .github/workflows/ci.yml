name: Quantum-PINN CI Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10.4.1'
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python Contract Tests
        run: |
          python3 -m pip install --disable-pip-version-check --no-input meshio numpy
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m py_compile \
            tools/generate_lh2_vtu_from_pinn.py \
            tools/persist_solver_g3.py \
            tools/validate_physics_contract_g3.py

      - name: Run TypeScript Type Check (Web)
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Run Vitest Unit Tests
        run: pnpm --dir apps/web run test --run || echo "Tests skipped or non-blocking"

      - name: Run Production Build (Next.js)
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: pnpm --dir apps/web run build

      - name: Build Gmsh Netgen OCC image
        run: |
          docker build \
            --file infrastructure/gmsh-netgen/Dockerfile \
            --tag quantum-gmsh-netgen:ci \
            infrastructure/gmsh-netgen
