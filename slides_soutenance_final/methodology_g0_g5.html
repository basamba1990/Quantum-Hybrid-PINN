<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #020617; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
      .slide-container { width: 1280px; min-height: 720px; padding: 60px; background: #020617; }
      .header { border-bottom: 2px solid #22d3ee; padding-bottom: 20px; margin-bottom: 60px; }
      h2 { font-size: 42px; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
      .process-flow { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 40px; position: relative; }
      .process-flow::before { content: ''; position: absolute; top: 50px; left: 0; right: 0; height: 4px; background: rgba(34, 211, 238, 0.2); z-index: 1; }
      .step { width: 220px; display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 2; }
      .step-icon { width: 100px; height: 100px; background: #1e293b; border: 4px solid #22d3ee; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; transition: none; }
      .step.active .step-icon { background: #22d3ee; color: #020617; box-shadow: 0 0 30px rgba(34, 211, 238, 0.4); }
      .step-icon i { font-size: 40px; }
      .step-label { font-size: 24px; font-weight: 900; color: #ffffff; margin-bottom: 10px; }
      .step-desc { font-size: 16px; color: #94a3b8; line-height: 1.4; }
      .validation-badge { margin-top: 80px; text-align: center; }
      .badge { display: inline-block; background: rgba(34, 211, 238, 0.1); border: 2px solid #22d3ee; padding: 15px 40px; border-radius: 50px; color: #22d3ee; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="header">
            <h2>Méthodologie de Certification G0-G5</h2>
        </div>
        <div class="process-flow">
            <div class="step active">
                <div class="step-icon"><i class="fas fa-drafting-compass"></i></div>
                <div class="step-label">G0</div>
                <div class="step-desc">Source CAO AP242<br>Unités SI & Unicité SHA-256</div>
            </div>
            <div class="step active">
                <div class="step-icon"><i class="fas fa-cube"></i></div>
                <div class="step-label">G1-G2</div>
                <div class="step-desc">Fermeture Manifold<br>Qualité Maillage Volumique</div>
            </div>
            <div class="step active">
                <div class="step-icon"><i class="fas fa-microchip"></i></div>
                <div class="step-label">G3-G4</div>
                <div class="step-desc">Physique NIST/NASA<br>Contrat de Cas Immuable</div>
            </div>
            <div class="step active">
                <div class="step-icon"><i class="fas fa-calculator"></i></div>
                <div class="step-label">G5</div>
                <div class="step-desc">Résidus Autograd<br>Seuil Critique < 10⁻⁷</div>
            </div>
        </div>
        <div class="validation-badge">
            <div class="badge"><i class="fas fa-check-circle"></i> Statut Industriel : VALIDATED</div>
        </div>
    </div>
</body>
</html>
